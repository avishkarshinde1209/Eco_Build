<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Architectural Grid Backdrop -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Building Skyline Silhouette -->
  <path d="M128 384 V240 H208 V176 H288 V224 H352 V288 H384 V384 Z" fill="#0f2922" opacity="0.8"/>
  <rect x="152" y="272" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>
  <rect x="152" y="328" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>
  <rect x="232" y="208" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>
  <rect x="232" y="264" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>
  <rect x="232" y="320" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>
  <rect x="304" y="256" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>
  <rect x="304" y="312" width="24" height="32" rx="4" fill="#34d399" opacity="0.4"/>

  <!-- Central Glowing Leaf (Ecology) -->
  <path d="M256 128 C336 128 384 192 384 272 C384 352 304 384 256 384 C208 384 128 352 128 272 C128 192 176 128 256 128 Z" fill="url(#leafGrad)" opacity="0.92"/>
  <path d="M256 144 C256 240 256 320 256 368" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 224 Q296 200 328 192" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 272 Q216 248 184 240" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M256 304 Q304 288 336 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Raindrop Water Icon (Hydrology) -->
  <path d="M168 184 C168 160 200 120 200 120 C200 120 232 160 232 184 C232 201.6 217.6 216 200 216 C182.4 216 168 201.6 168 184 Z" fill="url(#waterGrad)"/>

  <!-- Solar Sunburst Rays (Clean Energy) -->
  <circle cx="344" cy="168" r="28" fill="url(#solarGrad)"/>
  <g stroke="url(#solarGrad)" stroke-width="6" stroke-linecap="round">
    <line x1="344" y1="124" x2="344" y2="136"/>
    <line x1="344" y1="200" x2="344" y2="212"/>
    <line x1="300" y1="168" x2="312" y2="168"/>
    <line x1="376" y1="168" x2="388" y2="168"/>
    <line x1="313" y1="137" x2="321" y2="145"/>
    <line x1="367" y1="191" x2="375" y2="199"/>
    <line x1="313" y1="199" x2="321" y2="191"/>
    <line x1="367" y1="145" x2="375" y2="137"/>
  </g>
