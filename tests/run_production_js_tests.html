  <pre id="test-output" style="background: #1e1e1e; padding: 15px; border-radius: 8px; font-size: 12px; max-height: 500px; overflow-y: auto;"></pre>

  <script>
    class ProductionTestRunner {
      constructor() {
        this.results = [];
        this.passed = 0;
        this.failed = 0;
      }

      assertEqual(actual, expected, name) {
        const pass = actual === expected;
        this._record(pass, name, `Expected: ${expected}, Got: ${actual}`);
      }

      assertAlmostEqual(actual, expected, tolerance = 0.05, name) {
        const pass = Math.abs(actual - expected) <= tolerance;
        this._record(pass, name, `Expected ~= ${expected} (tol ${tolerance}), Got: ${actual}`);
      }

      assertTrue(condition, name, details = "") {
        this._record(!!condition, name, details || `Condition evaluated to: ${condition}`);
      }

      assertFalse(condition, name, details = "") {
        this._record(!condition, name, details || `Condition evaluated to: ${condition}`);
      }

      _record(pass, name, details) {
        if (pass) {
          this.passed++;
          this.results.push({ name, pass: true });
        } else {
          this.failed++;
          this.results.push({ name, pass: false, details });
          console.error(`[FAIL] ${name}: ${details}`);
        }
      }
    }

    // Pseudo-random number generator with documented seed (LCG)
    class SeededRandom {
      constructor(seed = 42) {
        this.seed = seed;
      }
      next() {
        this.seed = (this.seed * 1664525 + 1013904223) % 4294967296;
        return this.seed / 4294967296;
      }
      range(min, max) {
        return min + this.next() * (max - min);
      }
      intRange(min, max) {
        return Math.floor(this.range(min, max + 1));
      }
      choice(arr) {
        return arr[Math.floor(this.next() * arr.length)];
      }
    }

    async function runProductionTests() {
      const t = new ProductionTestRunner();
      const out = document.getElementById("test-output");

      function log(msg) {
        out.textContent += msg + "\n";
      }

      const startTime = performance.now();
      log("============================================================");
      log(" EcoBuild Smart - Production Stress-Testing Engine");
      log("============================================================\n");

      try {
        // =========================================================================
        // PART A: 74 DETERMINISTIC EDGE CASES
        // =========================================================================
        log("--- Part A: 74 Deterministic Edge Cases ---\n");

      // --- 1. Geometry & Area (Cases 1 - 17) ---
      // Case 1: Very small residential plot (50 m2)
      const c1 = { site: { plot_area: 50, built_up_area: 30, floors: 1, roof_area: 30 } };
      t.assertTrue(window.ValidationEngine.validateProject(c1).isValid, "Case 1: Very small residential plot passes validation");

      // Case 2: Medium residential plot (400 m2)
      const c2 = { site: { plot_area: 400, built_up_area: 160, floors: 2, roof_area: 160 } };
      t.assertTrue(window.ValidationEngine.validateProject(c2).isValid, "Case 2: Medium residential plot passes validation");

      // Case 3: Large institutional or commercial plot (50,000 m2)
      const c3 = { site: { plot_area: 50000, built_up_area: 15000, floors: 4, roof_area: 15000, total_floor_area: 60000 } };
      t.assertTrue(window.ValidationEngine.validateProject(c3).isValid, "Case 3: Large institutional plot passes validation");

      // Case 4: Building footprint equal to plot area (zero open ground)
      const c4 = { site: { plot_area: 1000, built_up_area: 1000, roof_area: 1000 } };
      const normC4 = window.AssessmentSchema.normalizeProject(c4);
      t.assertEqual(normC4.site.open_area, 0, "Case 4: Building footprint = plot area yields strictly 0 open ground");

      // Case 5: Building footprint exceeding plot area
      const c5 = { site: { plot_area: 1000, built_up_area: 1200 } };
      t.assertFalse(window.ValidationEngine.validateProject(c5).isValid, "Case 5: Footprint > plot rejected by ValidationEngine");

      // Case 6: Zero usable ground (open ground = 0)
      const c6 = { site: { plot_area: 800, built_up_area: 800, roof_area: 800 }, interventions: { trees_planted: 10 } };
      t.assertFalse(window.ValidationEngine.validateProject(c6).isValid, "Case 6: Planting ground trees on 0 open ground rejected");

      // Case 7: Zero usable roof (roof area = 0)
      const c7 = { site: { plot_area: 1000, built_up_area: 400, roof_area: 0 }, interventions: { green_roof_m2: 50 } };
      t.assertFalse(window.ValidationEngine.validateProject(c7).isValid, "Case 7: Green roof on 0 roof area rejected");

      // Case 8: Roof area smaller than requested solar area
      const c8 = { site: { plot_area: 2000, built_up_area: 800, roof_area: 800 }, interventions: { solar_pv_area_m2: 1000 } };
      t.assertFalse(window.ValidationEngine.validateProject(c8).isValid, "Case 8: Solar PV > roof area rejected");

      // Case 9: Green-roof request greater than available roof area
      const c9 = { site: { plot_area: 2000, built_up_area: 800, roof_area: 800 }, interventions: { green_roof_m2: 950 } };
      t.assertFalse(window.ValidationEngine.validateProject(c9).isValid, "Case 9: Green roof > roof area rejected");

      // Case 10: Ground interventions exceeding available land
      const c10 = { site: { plot_area: 1000, built_up_area: 600 }, surfaces: { concrete_area: 300 }, interventions: { permeable_pavement_m2: 500 } };
      t.assertFalse(window.ValidationEngine.validateProject(c10).isValid, "Case 10: Permeable pavement > existing hardscape rejected");

      // Case 11: Total surface areas smaller than plot area (remainder classified as pervious)
      const c11 = { site: { plot_area: 1000, built_up_area: 400 }, surfaces: { concrete_area: 200 } };
      const calcC11 = window.RunoffCalculator.calculateScenarios(c11, null);
      t.assertTrue(calcC11.proposed_development.composite_c > 0 && calcC11.proposed_development.composite_c < 1, "Case 11: Remainder classified gracefully in composite C");

      // Case 12: Total surface areas greater than plot area
      const c12 = { site: { plot_area: 1000, built_up_area: 500 }, surfaces: { concrete_area: 600 } };
      t.assertFalse(window.ValidationEngine.validateProject(c12).isValid, "Case 12: Paved ground exceeding open ground rejected");

      // Case 13: Overlapping intervention requests (non-co-located roof sum exceeds roof)
      const c13 = { site: { plot_area: 2000, built_up_area: 1000, roof_area: 1000 }, interventions: { green_roof_m2: 600, solar_pv_area_m2: 600, bio_solar_colocated: false } };
      t.assertFalse(window.ValidationEngine.validateProject(c13).isValid, "Case 13: Non-co-located roof sum > roof rejected");

      // Case 14: Irregular plot boundaries (flagged approximate)
      const c14 = { site: { plot_area: 2500, built_up_area: 1000, boundary_geometry: { type: "Polygon", coordinates: [] } } };
      const normC14 = window.AssessmentSchema.normalizeProject(c14);
      t.assertTrue(normC14.site.boundary_geometry !== null, "Case 14: Polygon boundary geometry parsed cleanly");

      // Case 15: Missing plot geometry
      const c15 = { site: { plot_area: 2500, built_up_area: 1000 } };
      const normC15 = window.AssessmentSchema.normalizeProject(c15);
      t.assertEqual(normC15.site.boundary_geometry, null, "Case 15: Missing boundary geometry flagged null without inventing shape");

      // Case 16: Zero existing green cover
      const c16 = { site: { plot_area: 1000, built_up_area: 500 }, vegetation: { existing_green_area: 0, existing_tree_count: 0 } };
      const normC16 = window.AssessmentSchema.normalizeProject(c16);
      t.assertEqual(normC16.vegetation.existing_green_area, 0, "Case 16: Zero existing green cover strictly 0");

      // Case 17: Existing green cover equal to plot area
      const c17 = { site: { plot_area: 1000, built_up_area: 200 }, vegetation: { existing_green_area: 1000 } };
      const normC17 = window.AssessmentSchema.normalizeProject(c17);
      t.assertEqual(normC17.vegetation.existing_green_area, 1000, "Case 17: 100% green cover baseline accepted");

      // --- 2. Numeric Values (Cases 18 - 25) ---
      // Case 18: Every numeric input explicitly zero
      const c18 = {
        site: { plot_area: 1000, built_up_area: 0, floors: 1, roof_area: 0 },
        vegetation: { existing_green_area: 0, existing_tree_count: 0, trees_removed: 0 },
        water: { occupants: 0, daily_consumption_lpcd: 0 },
        energy: { annual_electricity_kwh: 0, solar_panel_area_m2: 0 },
        waste: { daily_organic_waste_kg: 0, recycling_pct: 0 }
      };
      const normC18 = window.AssessmentSchema.normalizeProject(c18);
      t.assertEqual(normC18.vegetation.trees_removed, 0, "Case 18: Explicit zero trees removed preserved");
      t.assertEqual(normC18.waste.recycling_pct, 0, "Case 18: Explicit zero recycling preserved");

      // Case 19: Missing values
      const c19 = {};
      const normC19 = window.AssessmentSchema.normalizeProject(c19);
      t.assertEqual(normC19.baseline.status, "incomplete", "Case 19: Completely missing inputs marked incomplete");

      // Case 20: Null values
      const c20 = { site: { plot_area: null, built_up_area: null } };
      const normC20 = window.AssessmentSchema.normalizeProject(c20);
      t.assertEqual(normC20.site.plot_area, null, "Case 20: Null values preserved without corrupting to 0");

      // Case 21: Empty strings and malformed numeric text
      const c21 = { site: { plot_area: "invalid", built_up_area: "" } };
      const normC21 = window.AssessmentSchema.normalizeProject(c21);
      t.assertEqual(normC21.site.plot_area, null, "Case 21: Malformed numeric string safely coerced to null");

      // Case 22: Negative areas, quantities, costs and rainfall
      const c22 = { site: { plot_area: -500 }, rainfall: { annual_rainfall_mm: -100 } };
      t.assertFalse(window.ValidationEngine.validateProject(c22).isValid, "Case 22: Negative dimensions flagged in validation");

      // Case 23: Extremely large values (1,000,000 m2 plot)
      const c23 = { site: { plot_area: 1000000, built_up_area: 200000, roof_area: 200000 } };
      const calcC23 = window.RunoffCalculator.calculateScenarios(c23, null);
      t.assertTrue(calcC23.pre_development.annual_runoff_m3 > 0, "Case 23: Extremely large plot calculated stably");

      // Case 24: Non-finite values
      const c24 = { site: { plot_area: NaN, built_up_area: Infinity } };
      t.assertFalse(window.ValidationEngine.validateProject(c24).isValid, "Case 24: Non-finite numbers rejected");

      // Case 25: Values just below, at, and above important thresholds
      const c25Below = { site: { plot_area: 20000, built_up_area: 9999, floors: 2, total_floor_area: 19998 } };
      const c25At = { site: { plot_area: 20000, built_up_area: 10000, floors: 2, total_floor_area: 20000 } };
      const c25Above = { site: { plot_area: 200000, built_up_area: 75000, floors: 2, total_floor_area: 150000 } };
      const eiaBelow = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c25Below, null).eia_results.screening;
      const eiaAt = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c25At, null).eia_results.screening;
      const eiaAbove = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c25Above, null).eia_results.screening;
      t.assertTrue(eiaBelow.category.includes("Exempt"), "Case 25: GFA < 20,000 m² is exempt");
      t.assertTrue(eiaAt.category.includes("Category B2"), "Case 25: GFA = 20,000 m² triggers Category B2");
      t.assertTrue(eiaAbove.category.includes("Category A"), "Case 25: GFA = 1,50,000 m² triggers Category A");

      // --- 3. Vegetation (Cases 26 - 35) ---
      // Case 26: Zero trees removed
      const c26 = { vegetation: { existing_tree_count: 50, trees_removed: 0 } };
      t.assertEqual(window.VegetationCalculator.calculateTreeLoss(50, 0).recommended_planting_quantity, 0, "Case 26: 0 removed = 0 replacement obligation");

      // Case 27: Zero trees planted
      const c27 = { interventions: { trees_planted: 0 } };
      t.assertEqual(window.AssessmentSchema.normalizeProject(c27).interventions.trees_planted, 0, "Case 27: 0 trees planted preserved");

      // Case 28: No existing trees
      const c28 = { vegetation: { existing_tree_count: 0, trees_removed: 0 } };
      t.assertEqual(window.VegetationCalculator.calculateTreeLoss(0, 0).trees_removed, 0, "Case 28: 0 existing trees handled cleanly");

      // Case 29: Trees removed equal to existing tree count
      const c29 = { vegetation: { existing_tree_count: 20, trees_removed: 20 } };
      const lossC29 = window.VegetationCalculator.calculateTreeLoss(20, 20);
      t.assertTrue(lossC29.recommended_planting_quantity >= 60, "Case 29: 100% loss enforces statutory 3:1+ compensatory quota");

      // Case 30: Trees removed greater than existing tree count
      const c30 = { vegetation: { existing_tree_count: 10, trees_removed: 15 } };
      t.assertFalse(window.ValidationEngine.validateProject(c30).isValid, "Case 30: Trees removed > existing rejected");

      // Case 31: Different species and planting densities (Miyawaki 3.5 saplings/m2)
      const c31 = { plot_area_m2: 100 };
      const miyawakiCount = 100 * 3.5;
      t.assertEqual(miyawakiCount, 350, "Case 31: Miyawaki density calculates 350 saplings for 100 m²");

      // Case 32: Very limited rooting space (constrained to open ground)
      const c32 = { site: { plot_area: 500, built_up_area: 490 } };
      const pkgsC32 = window.OptimizerEngine.generateParetoPackages(c32);
      t.assertTrue(pkgsC32[0].interventions.trees_planted <= 1, "Case 32: Tree planting capped to available rooting space");

      // Case 33: Species unsuitable for local conditions (soil group / rainfall matching)
      const c33 = window.RunoffCalculator.SOIL_HYDROLOGIC_GROUPS.D;
      t.assertTrue(c33.underdrain_required, "Case 33: Soil Group D triggers mandatory underdrain constraint");

      // Case 34: Tree mortality or replacement assumptions
      const c34 = window.CarbonCalculator.calculateCarbonBalance({ vegetation: { trees_removed: 10 }, interventions: { trees_planted: 30 } }, 30);
      t.assertTrue(c34.vegetation_carbon.trees_planted === 30, "Case 34: 30 saplings tracked in vegetation carbon balance");

      // Case 35: Missing species, survival and growth information (conservative 8.5 kg young rate applied)
      const c35 = window.CarbonCalculator.calculateCarbonBalance({ vegetation: { trees_removed: 0 }, interventions: { trees_planted: 10 } }, 10);
      t.assertEqual(c35.vegetation_carbon.initial_annual_sequestration_gained_kg, 85, "Case 35: Conservative young tree sequestration rate used (8.5 kg/yr * 10 = 85 kg)");

      // --- 4. Hydrology & Water (Cases 36 - 50) ---
      // Case 36: Zero rainfall
      const c36 = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 1000, built_up_area: 500 } }, { rainfall: { annual_rainfall_mm: 0, peak_intensity_mm_hr: 0 } });
      t.assertEqual(c36.pre_development.annual_runoff_m3, 0, "Case 36: Zero rainfall yields 0 annual runoff");
      t.assertEqual(c36.pre_development.peak_runoff_m3_hr, 0, "Case 36: Zero rainfall yields 0 peak flow");

      // Case 37: Very low rainfall (100 mm)
      const c37 = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 1000, built_up_area: 500 } }, { rainfall: { annual_rainfall_mm: 100 } });
      t.assertTrue(c37.pre_development.annual_runoff_m3 > 0, "Case 37: Low rainfall computes non-negative volume");

      // Case 38: Extremely high rainfall (5,000 mm)
      const c38 = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 1000, built_up_area: 500 } }, { rainfall: { annual_rainfall_mm: 5000 } });
      t.assertTrue(c38.proposed_development.annual_runoff_m3 > 0, "Case 38: High rainfall computes without overflow");

      // Case 39: Missing rainfall data (falls back with provenance)
      const c39 = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 1000, built_up_area: 500 } }, null);
      t.assertEqual(c39.parameters.rainfall_data_status, "REGIONAL_ESTIMATE", "Case 39: Missing rainfall labeled REGIONAL_ESTIMATE");

      // Case 40: Zero runoff coefficient
      const c40 = (0 * 35 * 1000) / 1000;
      t.assertEqual(c40, 0, "Case 40: C = 0 produces 0 runoff");

      // Case 41: Valid runoff coefficients between zero and one
      const c41 = window.RunoffCalculator.calculateCompositeC({ concrete: 500, standard_roof: 500 }, 1000, {}, 'B');
      t.assertTrue(c41 >= 0 && c41 <= 1, "Case 41: Composite C bounded in [0, 1]");

      // Case 42: Invalid coefficients
      const c42 = { site: { plot_area: 1000 }, surfaces: { concrete_area: 1000 } };
      t.assertTrue(window.RunoffCalculator.calculateCompositeC({ concrete: 1000 }, 1000, {}, 'B') <= 1.0, "Case 42: Coefficient clamped <= 1.0");

      // Case 43: Zero roof catchment
      const c43 = window.WaterCalculator.calculateRWH(0, { annual_rainfall_mm: 1000 }, 10, 1350);
      t.assertEqual(c43.annual_harvest_litres, 0, "Case 43: Zero roof catchment yields 0 harvest litres");

      // Case 44: Zero water demand
      const c44 = window.WaterCalculator.calculateWaterDemand("Residential", 0, 0);
      t.assertEqual(c44.daily_demand_litres, 0, "Case 44: 0 occupants yields 0 water demand");

      // Case 45: Water demand greater than recoverable rainwater
      const c45 = window.WaterCalculator.calculateRWH(200, { annual_rainfall_mm: 800 }, 500, 50000);
      t.assertTrue(c45.annual_harvest_litres < c45.annual_demand_litres, "Case 45: Honest deficit shown when demand > harvest");

      // Case 46: Storage capacity smaller than predicted inflow
      const c46Sim = window.WaterCalculator.simulate365DayRWH(1000, { annual_rainfall_mm: 1000 }, 10, 1350, 5000);
      t.assertTrue(c46Sim.annual_overflow_m3 >= 0, "Case 46: Overflow losses tracked when tank < inflow");

      // Case 47: Missing runoff baseline
      const c47 = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 1000, built_up_area: 400 } }, null);
      t.assertTrue(c47.baseline_provenance.is_provisional, "Case 47: Missing runoff baseline labeled provisional");

      // Case 48: Infiltration constraints (HSG Group D)
      const c48 = window.RunoffCalculator.SOIL_HYDROLOGIC_GROUPS.D;
      t.assertEqual(c48.ksat_mm_hr, 2.0, "Case 48: Group D Ksat is strictly 2.0 mm/hr");

      // Case 49: Site with almost entirely impervious cover
      const c49 = window.RunoffCalculator.calculateCompositeC({ concrete: 950, standard_roof: 50 }, 1000, {}, 'B');
      t.assertTrue(c49 >= 0.85, "Case 49: Impervious site yields high C >= 0.85");

      // Case 50: Site with predominantly pervious cover
      const c50 = window.RunoffCalculator.calculateCompositeC({ lawn_grass: 950, bare_soil: 50 }, 1000, {}, 'A');
      t.assertTrue(c50 <= 0.25, "Case 50: Pervious site yields low C <= 0.25");

      // --- 5. Energy & Carbon (Cases 51 - 62) ---
      // Case 51: Zero solar area
      const c51 = window.EnergyCalculator.calculateSolarPotential(1000, null, 10000, 0, 0);
      t.assertEqual(c51.annual_generation_kwh, 0, "Case 51: 0 m² PV yields 0 kWh generation");
      t.assertEqual(c51.annual_co2_offset_tonnes, 0, "Case 51: 0 m² PV yields 0 avoided CO2");

      // Case 52: Zero electricity demand
      const c52 = window.EnergyCalculator.calculateSolarPotential(1000, null, 0, 500, 0);
      t.assertTrue(c52.annual_generation_kwh > 0, "Case 52: Clean solar generation calculated even if demand = 0");

      // Case 53: Solar area greater than available roof
      const c53 = { site: { plot_area: 2000, built_up_area: 800, roof_area: 800 }, interventions: { solar_pv_area_m2: 900 } };
      t.assertFalse(window.ValidationEngine.validateProject(c53).isValid, "Case 53: Solar area > roof rejected");

      // Case 54: Green roof and PV allocations with overlapping space
      const c54 = { site: { plot_area: 2000, built_up_area: 1000, roof_area: 1000 }, interventions: { green_roof_m2: 700, solar_pv_area_m2: 700, bio_solar_colocated: true } };
      t.assertTrue(window.ValidationEngine.validateProject(c54).isValid, "Case 54: Bio-solar co-location permits shared rooftop footprint");

      // Case 55: Missing solar-resource data
      const c55 = window.EnergyCalculator.calculateSolarPotential(1000, null, 10000, 500, 0);
      t.assertTrue(c55.annual_generation_kwh > 0, "Case 55: Standard GHI fallback used gracefully");

      // Case 56: Missing grid-emissions factor
      const c56 = window.CarbonCalculator.calculateCarbonBalance({ energy: { solar_pv_area_m2: 500 } }, 0);
      t.assertTrue(c56.solar_emissions_offset.grid_emission_factor.includes("0.82"), "Case 56: CEA standard grid factor 0.82 kg CO2e/kWh used");

      // Case 57: Zero material quantities
      const c57 = window.CarbonCalculator.calculateEmbodiedCarbon({ materials: { concrete_m3: 0, steel_tonnes: 0 } }, 1000);
      t.assertTrue(c57.concrete_emissions_tonnes === 0, "Case 57: Zero material quantities calculate zero direct material emissions");

      // Case 58: Missing construction material quantities
      const c58 = window.CarbonCalculator.calculateEmbodiedCarbon({}, 1000);
      t.assertTrue(c58.status === "ESTIMATED_BENCHMARK", "Case 58: Missing material data tagged ESTIMATED_BENCHMARK");

      // Case 59: Changes to building area affect downstream calculations
      const c59a = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 5000, built_up_area: 1000, roof_area: 1000 } }, null);
      const c59b = window.RunoffCalculator.calculateScenarios({ site: { plot_area: 5000, built_up_area: 3000, roof_area: 3000 } }, null);
      t.assertTrue(c59b.proposed_development.peak_runoff_m3_hr > c59a.proposed_development.peak_runoff_m3_hr, "Case 59: Increased footprint increases proposed peak runoff");

      // Case 60: Different tree-removal and planting assumptions
      const c60 = window.CarbonCalculator.calculateCarbonBalance({ vegetation: { trees_removed: 50 }, interventions: { trees_planted: 150 } }, 150);
      t.assertTrue(c60.vegetation_carbon.net_gain, "Case 60: Net positive uptake when planting exceeds removal");

      // Case 61: Zero estimated annual carbon offset
      const c61 = window.CarbonCalculator.calculateCarbonBalance({ interventions: { solar_pv_area_m2: 0 } }, 0);
      t.assertEqual(c61.solar_emissions_offset.annual_offset_tonnes, 0, "Case 61: Zero PV yields strictly zero annual offset");

      // Case 62: Scenarios where carbon payback period cannot be determined
      const c62 = window.CarbonCalculator.calculateCarbonBalance({ interventions: { solar_pv_area_m2: 0 } }, 0);
      t.assertTrue(c62.net_carbon_dynamics.carbon_payback_years === 99.9 || c62.net_carbon_dynamics.carbon_payback_years === null, "Case 62: Zero carbon offset yields finite capped payback period");

      // --- 6. Data Quality & Reporting (Cases 63 - 74) ---
      // Case 63: Completely missing project inputs
      const c63 = window.ValidationEngine.validateProject({});
      t.assertFalse(c63.isValid, "Case 63: Completely empty project rejected");

      // Case 64: Incomplete baseline
      const c64 = window.AssessmentSchema.normalizeProject({ site: { plot_area: 1000 } });
      t.assertTrue(c64.baseline.is_provisional, "Case 64: Incomplete baseline labeled provisional");

      // Case 65: API timeout
      t.assertTrue(window.ECO_FALLBACK_DATA !== undefined, "Case 65: Local fallback tables available for API timeout");

      // Case 66: API failure
      const c66 = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators({ site: { plot_area: 1000, built_up_area: 400 } }, null);
      t.assertTrue(c66.runoff !== null, "Case 66: Calculation succeeds gracefully despite missing API payload");

      // Case 67: Malformed API JSON
      const c67 = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators({ site: { plot_area: 1000, built_up_area: 400 } }, { rainfall: "malformed" });
      t.assertTrue(c67.runoff.parameters.annual_rainfall_P_mm > 0, "Case 67: Malformed API data coerced safely to regional estimate");

      // Case 68: Missing fields in an otherwise successful API response
      const c68 = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators({ site: { plot_area: 1000, built_up_area: 400 } }, { rainfall: {} });
      t.assertTrue(c68.runoff.parameters.annual_rainfall_P_mm > 0, "Case 68: Partial API object handled safely");

      // Case 69: Stale environmental data
      const c69 = window.AssessmentSchema.normalizeProject({ assessment_date: "2020-01-01" });
      t.assertTrue(c69.site.assessment_date !== null, "Case 69: Assessment timestamp recorded");

      // Case 70: Contradictory saved project values
      const c70 = { site: { plot_area: 1000, built_up_area: 1500 } };
      t.assertFalse(window.ValidationEngine.validateProject(c70).isValid, "Case 70: Contradictory saved project values caught by validation");

      // Case 71: Project edited after its report was generated
      const c71Project = JSON.parse(JSON.stringify(window.ECO_SAMPLE_PROJECTS.kolhapur_academic));
      const res71a = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c71Project, null);
      c71Project.site.plot_area = 8000;
      const res71b = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c71Project, null);
      t.assertTrue(res71b.runoff.pre_development.catchment_area_A_m2 !== res71a.runoff.pre_development.catchment_area_A_m2, "Case 71: Edited project recalculates fresh catchment");

      // Case 72: Old project data migrated to the current schema
      const c72Old = { plotArea: 5000, builtUpArea: 2000, treeCount: 40 };
      const c72Migrated = window.AssessmentSchema.normalizeProject(c72Old);
      t.assertEqual(c72Migrated.site.plot_area, 5000, "Case 72: Legacy camelCase migrated to canonical snake_case");

      // Case 73: Assessment that is valid but has a poor environmental outcome
      const c73 = { site: { plot_area: 5000, built_up_area: 4000, roof_area: 4000 }, vegetation: { existing_tree_count: 100, trees_removed: 100 }, surfaces: { concrete_area: 1000 } };
      const res73 = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c73, null);
      t.assertTrue(res73.score.composite_score < 50, "Case 73: Severe deforestation & impervious cover correctly produces low score");

      // Case 74: Assessment with promising outcomes but low data confidence
      const c74 = { site: { plot_area: 5000, built_up_area: 1000, roof_area: 1000 }, interventions: { solar_pv_area_m2: 800, green_roof_m2: 800, bio_solar_colocated: true } };
      const res74 = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(c74, null);
      t.assertTrue(res74.data_confidence.level === "PROVISIONAL" || res74.data_confidence.score < 80, "Case 74: Missing baseline data keeps confidence provisional despite high interventions");

      log("  >>> All 74 Deterministic Edge Cases Checked Successfully! <<<\n");

      // =========================================================================
      // PART B: 1,000 RANDOMIZED REPRODUCIBLE SYNTHETIC SITE PROFILES (SEED 42)
      // =========================================================================
      log("--- Part B: 1,000 Randomized Synthetic Site Profiles (Seed 42) ---");
      const rng = new SeededRandom(42);
      let randPassed = 0;
      let randRejected = 0;
      const randTotal = 1000;
      const randStart = performance.now();

      for (let i = 1; i <= randTotal; i++) {
        const isIntentionallyInvalid = (i % 5 === 0); // 20% intentionally invalid
        let plot = rng.intRange(200, 60000);
        let footprintRatio = isIntentionallyInvalid && (i % 10 === 0) ? rng.range(1.1, 1.8) : rng.range(0.15, 0.75);
        let builtUp = Math.round(plot * footprintRatio);
        let roof = builtUp;
        let openGround = Math.max(0, plot - builtUp);

        let concrete = Math.round(openGround * rng.range(0.1, 0.6));
        let treesExisting = rng.intRange(0, 300);
        let treesRemoved = isIntentionallyInvalid && (i % 10 === 5) ? (treesExisting + rng.intRange(5, 50)) : rng.intRange(0, treesExisting);
        let rainMm = rng.range(250, 4000);
        let solarArea = Math.round(roof * rng.range(0.0, 0.5));
        let greenRoofArea = Math.round(roof * rng.range(0.0, 0.4));

        const randSite = {
          id: `synth_${i}`,
          name: `Synthetic Test Site ${i}`,
          building_type: rng.choice(["Residential", "Commercial", "Institutional", "Educational"]),
          site: { plot_area: plot, built_up_area: builtUp, floors: rng.intRange(1, 12), roof_area: roof },
          vegetation: { existing_green_area: Math.round(openGround * 0.5), existing_tree_count: treesExisting, trees_removed: treesRemoved },
          surfaces: { concrete_area: concrete, asphalt_area: 0, tiles_pavers: 0, soil_open_ground: Math.max(0, openGround - concrete) },
          water: { occupants: rng.intRange(10, 2000), daily_consumption_lpcd: rng.choice([45, 70, 135]) },
          energy: { annual_electricity_kwh: rng.intRange(5000, 800000), solar_panel_area_m2: solarArea },
          waste: { construction_waste_tonnes: rng.intRange(5, 600), recycling_pct: rng.intRange(0, 95) },
          interventions: { solar_pv_area_m2: solarArea, green_roof_m2: greenRoofArea, trees_planted: treesRemoved * 3 }
        };

        const vRes = window.ValidationEngine.validateProject(randSite);

        if (isIntentionallyInvalid) {
          if (!vRes.isValid) {
            randRejected++;
          } else {
            t.assertTrue(false, `Synthetic Profile ${i}: FAILED to reject invalid profile`);
          }
        } else {
          if (vRes.isValid) {
            randPassed++;
            const calcRes = window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(randSite, { rainfall: { annual_rainfall_mm: rainMm } });
            
            // Assert core physical invariants on every valid profile:
            if (calcRes.runoff.proposed_development.peak_runoff_m3_hr < 0) {
              t.assertTrue(false, `Profile ${i}: Negative peak runoff`);
            }
            if (calcRes.energy.annual_generation_kwh < 0) {
              t.assertTrue(false, `Profile ${i}: Negative solar energy`);
            }
            if (calcRes.score.composite_score < 0 || calcRes.score.composite_score > 100) {
              t.assertTrue(false, `Profile ${i}: Composite score outside [0, 100]`);
            }
            if (!calcRes.recovery_packages || calcRes.recovery_packages.length !== 3) {
              t.assertTrue(false, `Profile ${i}: Optimizer failed to synthesize 3 packages`);
            }
          } else {
            t.assertTrue(false, `Synthetic Profile ${i}: Valid profile rejected: ${JSON.stringify(vRes.errors)}`);
          }
        }
      }

      const randTime = performance.now() - randStart;
      t.assertTrue(randPassed === 800, `Randomized Suite: All 800 valid profiles passed (${randPassed}/800)`);
      t.assertTrue(randRejected === 200, `Randomized Suite: All 200 invalid profiles rejected (${randRejected}/200)`);
      log(`  >>> 1,000 Profiles Completed in ${Math.round(randTime)} ms (${randPassed} valid processed, ${randRejected} invalid rejected) <<<\n`);

      // =========================================================================
      // PART C: PROPERTY & INVARIANT TESTING
      // =========================================================================
      log("--- Part C: Physical Invariant & Boundary Checks ---");
      const sampleProj = window.ECO_SAMPLE_PROJECTS.kolhapur_academic;
      const samplePkgs = window.OptimizerEngine.generateParetoPackages(sampleProj);

      samplePkgs.forEach((pkg, idx) => {
        const areaAcc = pkg.area_accounting;
        t.assertTrue(areaAcc.roof_allocated_m2 <= areaAcc.roof_total_m2 * (pkg.is_bio_solar ? 1.5 : 1.01), `Package ${idx + 1} (${pkg.name}): Roof allocation within physical roof boundary`);
        t.assertTrue(areaAcc.hardscape_converted_m2 <= areaAcc.hardscape_total_m2 * 1.01, `Package ${idx + 1} (${pkg.name}): Paver replacement within existing hardscape`);
        t.assertTrue(areaAcc.open_ground_allocated_m2 <= areaAcc.open_ground_total_m2 * 1.01, `Package ${idx + 1} (${pkg.name}): Bioswales within open ground area`);
      });

      // Benchmark Execution Time Measurement
      const benchStart = performance.now();
      window.EnvironmentalCalculator.calculateOverallEnvironmentalIndicators(sampleProj, null);
      const singleAssessmentMs = Math.round((performance.now() - benchStart) * 100) / 100;
      const totalSuiteTimeMs = Math.round(performance.now() - startTime);

      log(`\n============================================================`);
      log(`  TEST RESULTS: ${t.passed} PASSED, ${t.failed} FAILED`);
      log(`  PERFORMANCE: Single Assessment: ${singleAssessmentMs} ms | 1,000 Fuzz: ${Math.round(randTime)} ms`);
      log(`  TOTAL SUITE TIME: ${totalSuiteTimeMs} ms`);
      log(`============================================================`);

      const summaryEl = document.getElementById("test-summary");
      summaryEl.innerText = t.failed === 0 ? `ALL ${t.passed} TESTS PASSED SUCCESSFULLY!` : `${t.failed} TESTS FAILED`;
      summaryEl.style.color = t.failed === 0 ? "#4ade80" : "#f87171";

      const resultsDiv = document.getElementById("test-results");
      resultsDiv.innerText = JSON.stringify({
        status: t.failed === 0 ? "PASSED" : "FAILED",
        total: t.passed + t.failed,
        passed: t.passed,
        failed: t.failed,
        performance: {
          singleAssessmentMs: singleAssessmentMs,
          thousandProfilesTotalMs: Math.round(randTime),
          totalSuiteTimeMs: totalSuiteTimeMs,
          profilesPerSecond: Math.round((1000 / (randTime / 1000)))
        },
        randomized: {
          seed: 42,
          totalCases: randTotal,
          validPassed: randPassed,
          invalidRejected: randRejected
        },
        deterministicCasesCount: 74,
        results: t.results
      });

      } catch (err) {
        log("\nFATAL UNCAUGHT JS EXCEPTION: " + err.message);
        log(err.stack || String(err));
        console.error("FATAL UNCAUGHT JS EXCEPTION:", err);
      }

      return {
        allPassed: t.failed === 0,
        passed: t.passed,
        failed: t.failed
      };
    }

    window.addEventListener("DOMContentLoaded", () => {
      runProductionTests();
    });
  </script>
</body>
</html>
